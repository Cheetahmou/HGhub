name: Build HGhub for Windows

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive # HGhub 如有子模块，确保拉取

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust 1.90+
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (using project script)
        run: pnpm app:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HGhub-Windows
          # Tauri 2 的 NSIS 安装包和 MSI 默认输出路径
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
